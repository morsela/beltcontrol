name: test

# The job name below ("test") is the status check that main's branch protection
# requires, so renaming the job silently un-gates the branch — update the
# required context in repo settings at the same time if you ever do.
on:
  pull_request:
    branches: [main]
  # Also on main itself: PRs are squash-merged, so the commit that lands is not
  # the commit CI saw on the branch. This gives that squashed commit its own run.
  push:
    branches: [main]

# A force-push to a PR branch makes the in-flight run answer a question nobody
# is asking any more.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node the app is developed against; vite 8 and vitest 4
          # both want a current runtime.
          node-version: 24
          cache: npm

      # ci, not install: the lockfile is committed, and a gate that quietly
      # resolves different dependencies than the developer has is not a gate.
      - run: npm ci

      # Ordered cheapest-first, so an obvious break reports in seconds rather than
      # after a minute of jsdom. All four run in one job on purpose: they are one
      # question — is this branch fit to merge — and splitting them would multiply
      # the required status checks the branch protection has to name.
      - run: npm run lint

      # The typecheck was only ever reached through `npm run build`, which CI did not
      # run — so a type error was caught by the deploy rather than by the pull request.
      - run: npm run check

      - run: npm test

      # And the build itself: `check` covers its `tsc` half, so what this adds is the
      # bundling — a broken import or a plugin that throws at build time is a failure
      # that belongs to the branch, not to whoever deploys it next.
      - run: npm run build
