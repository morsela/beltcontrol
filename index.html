<!-- Structured data. The app is free, browser-only and hardware-bound, so the parts that
     matter to a search result are the price (nothing), the requirement (Web Bluetooth) and
     the independence note — the same three things a visitor needs to know before clicking. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Belt Control",
  "url": "https://beltcontrol.com/",
  "applicationCategory": "HealthApplication",
  "applicationSubCategory": "Treadmill control",
  "operatingSystem": "Any (runs in the browser)",
  "browserRequirements": "Requires Web Bluetooth: Chrome 56+, Edge, Opera or Samsung Internet. Firefox and Safari are not supported.",
  "description": "An independent web app that connects to a treadmill speaking the KingSmith / WalkingPad Bluetooth protocols to start it, stop it, set speed, read live telemetry and keep a private history of every walk.",
  "disambiguatingDescription": "Not affiliated with, endorsed by, or sponsored by Beijing KingSmith Technology Co., Ltd. WalkingPad and KingSmith are their trademarks, used here only to identify compatible treadmills.",
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "featureList": [
    "Start, stop and set treadmill speed over Web Bluetooth",
    "Live speed, distance, steps and calorie telemetry",
    "Automatic session detection and daily totals",
    "30-day history, goal tracking and a consistency heatmap",
    "JSON backup and CSV export, stored only in the browser"
  ],
  "softwareHelp": "https://github.com/morsela/walkingpad#readme",
  "codeRepository": "https://github.com/morsela/walkingpad",
  "author": { "@type": "Person", "name": "morsela" }
}

<style>
  /* Only ever rendered inside <noscript>, so it costs nothing in the normal path. */
  .fallback { max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem;
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #101418; }
  .fallback h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  .fallback .lede { color: #67707d; margin-top: 0; }
  .fallback small { color: #67707d; }
  @media (prefers-color-scheme: dark) { .fallback { color: #e8ecf1; } }
</style>

<body>
<div id="app"></div>
<noscript>
  <div class="fallback">
    <h1>Belt Control</h1>
    <p class="lede">A treadmill controller that runs in the browser.</p>
    <p>
      Belt Control talks directly to a treadmill speaking the KingSmith / WalkingPad Bluetooth
      protocols — start, stop, set speed, watch live telemetry, and keep a private history of
      every walk, without the manufacturer's phone app. The Bluetooth link is browser to
      treadmill over the local radio; the server only ships static files and never sees any
      telemetry.
    </p>
    <p><strong>It needs JavaScript and Web Bluetooth</strong>, which means:</p>
    <ul>
      <li>Chrome 56+, Edge, Opera or Samsung Internet — supported, desktop or Android.</li>
      <li>Firefox and Safari, including Safari on iOS — not supported. Neither browser ever
        implemented Web Bluetooth, so no iPhone or iPad can run this app.</li>
    </ul>
    <p><a href="https://github.com/morsela/walkingpad">Source, protocol notes and compatibility
      table on GitHub</a>.</p>
    <p><small>Belt Control is an independent project. It is not affiliated with, endorsed by,
      or sponsored by Beijing KingSmith Technology Co., Ltd. WalkingPad® and KingSmith® are
      trademarks of that company, used here only to say which treadmills this app can talk
      to.</small></p>
  </div>
</noscript>
<script type="module" src="/src/main.tsx"></script>
