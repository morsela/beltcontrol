<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Belt Control">
  <!-- The belt seen from above: deck, then slats. Three filled shapes, no strokes, and
       nothing narrower than 24px in a 512px box — a favicon is 16px, where a 24px feature
       is one and a half pixels and anything finer is gone. The walker this replaced was
       eight strokes and a dashed centre line, none of which survived that reduction. -->
  <rect width="512" height="512" rx="112" fill="#101418"/>
  <rect x="60" y="192" width="392" height="128" rx="64" fill="#3ddc91"/>
  <g fill="#101418">
    <rect x="126" y="244" width="68" height="24" rx="12"/>
    <rect x="222" y="244" width="68" height="24" rx="12"/>
    <rect x="318" y="244" width="68" height="24" rx="12"/>
  </g>
</svg>
