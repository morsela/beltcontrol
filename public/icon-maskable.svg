<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Belt Control">
  <!-- Maskable variant: full-bleed background, glyph scaled to 75%. Android's safe zone is
       the centre circle of 80% diameter (radius 205 about 256,256); at this scale the deck's
       far corner sits 155 from centre, so every mask shape — circle, squircle, teardrop —
       cuts background and nothing else. -->
  <rect width="512" height="512" fill="#101418"/>
  <g transform="translate(256 256) scale(0.75) translate(-256 -256)">
    <rect x="60" y="192" width="392" height="128" rx="64" fill="#3ddc91"/>
    <g fill="#101418">
      <rect x="126" y="244" width="68" height="24" rx="12"/>
      <rect x="222" y="244" width="68" height="24" rx="12"/>
      <rect x="318" y="244" width="68" height="24" rx="12"/>
    </g>
  </g>
</svg>
